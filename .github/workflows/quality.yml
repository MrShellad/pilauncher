name: Code Quality

on:
  push:
  pull_request:

jobs:
  frontend:
    name: Structure and frontend build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.26.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check source structure
        run: pnpm structure:check

      - name: Build frontend
        run: pnpm build
